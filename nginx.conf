# Cache for /img-proxy/ (prompt-library cover images relayed for regions where the image hosts are blocked).
proxy_cache_path /var/cache/nginx/img-proxy levels=1:2 keys_zone=img_proxy:10m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must be revalidated on every load, otherwise browsers keep an old index.html
    # (pointing at the previous hashed bundle) after a deploy. SPA routes fall back here too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed files under /assets/: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Image relay: /img-proxy/<host>/<path>. Only the fixed host allowlist below is reachable
    # (keep it in sync with PROXIED_IMAGE_HOSTS in web/src/constant/runtime-config.ts), so this is
    # not an open proxy. Enabled on the client with IMAGE_PROXY=on.
    location ~ ^/img-proxy/(raw\.githubusercontent\.com|pbs\.twimg\.com|cms-assets\.youmind\.com|cdn\.imgedify\.com|bibigpt-apps\.chatvid\.ai|cdn\.jsdelivr\.net)/ {
        limit_except GET {
            deny all;
        }
        set $img_host $1;
        # Forward the path exactly as the browser encoded it (location regexes see the decoded URI).
        set $img_path "";
        if ($request_uri ~ "^/img-proxy/[^/]+(/.*)$") {
            set $img_path $1;
        }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://$img_host$img_path;
        proxy_ssl_server_name on;
        proxy_set_header Host $img_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; infinite-canvas-image-relay)";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_redirect off;

        proxy_cache img_proxy;
        proxy_cache_key $img_host$img_path;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        # Served from this origin, so never let the relayed content run as a page here.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Img-Cache $upstream_cache_status always;
    }
}
